<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Admin Dashboard | UzHandy USA LLC</title><style>
:root{--navy:#172033;--navy2:#101722;--red:#c9413a;--cream:#f7f4ee;--ink:#25282d;--muted:#69717d;--line:#e1ddd5;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f4f2ed;color:var(--ink)}button,input,select,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{background:var(--navy2);color:#dce3ec;padding:24px 18px}.brand{font-weight:950;color:#fff;font-size:1.2rem;padding:8px 10px 26px}.brand small{display:block;color:#8fa0b5;font-size:.65rem;letter-spacing:.15em}.side a,.side button{display:block;width:100%;text-align:left;color:inherit;background:none;border:0;padding:12px;border-radius:10px;font-weight:750;text-decoration:none;cursor:pointer}.side a.active,.side a:hover,.side button:hover{background:#202b40;color:#fff}.main{padding:28px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.top h1{margin:0;color:var(--navy)}.user{color:var(--muted);font-size:.82rem;margin-top:4px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:16px}.stat{padding:20px}.stat span{font-size:.75rem;color:var(--muted);font-weight:850;text-transform:uppercase}.stat b{display:block;font-size:1.9rem;color:var(--navy);margin-top:7px}.panel{margin-top:18px;overflow:hidden}.panel-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.panel-head h2{margin:0;color:var(--navy);font-size:1.1rem}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:.75rem;font-weight:800;cursor:pointer}.filter.on{background:var(--navy);color:#fff}.request{display:grid;grid-template-columns:1.3fr 1fr .8fr auto;gap:12px;align-items:center;padding:16px 20px;border-bottom:1px solid #eee}.request:last-child{border:0}.request b{color:var(--navy)}.request small{display:block;color:var(--muted);margin-top:3px}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:.68rem;font-weight:900;background:#edf1f5}.badge.new{background:#fff0ef;color:#a12d28}.badge.contacted{background:#eef5fb;color:#376585}.badge.scheduled{background:#fff5df;color:#8a6517}.badge.completed{background:#eaf6ef;color:#26734d}.empty,.loading{padding:38px;text-align:center;color:var(--muted)}.btn{min-height:42px;border:0;border-radius:10px;padding:0 14px;font-weight:850;cursor:pointer}.light{background:#fff;border:1px solid var(--line);color:var(--navy)}dialog{border:0;border-radius:18px;padding:0;max-width:600px;width:calc(100% - 28px)}dialog::backdrop{background:#0a1020aa}.modal{padding:24px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:.78rem;font-weight:850}.field input,.field select,.field textarea{padding:12px;border:1px solid #d6d4cf;border-radius:10px;font-size:16px}.field textarea{min-height:110px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.dark{background:var(--navy);color:#fff}.mobile{display:none}.error{background:#fff0ef;color:#9b2d28;border:1px solid #f0c8c5;padding:12px;border-radius:10px;margin-top:18px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.photo{aspect-ratio:1;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#f3f3f3;cursor:pointer}.photo img{width:100%;height:100%;object-fit:cover;display:block}.photo-empty{color:var(--muted);font-size:.85rem}.photo-loading{color:var(--muted);font-size:.85rem}.photo-view{max-width:min(92vw,900px);width:auto;background:transparent}.photo-view img{display:block;max-width:92vw;max-height:82vh;border-radius:14px}.photo-close{position:fixed;right:18px;top:18px;border:0;border-radius:999px;width:46px;height:46px;font-size:25px;background:#fff;color:#172033;cursor:pointer}
@media(max-width:850px){.app{display:block}.side{display:none}.mobile{display:flex;background:var(--navy2);color:#fff;padding:14px 16px;justify-content:space-between;align-items:center}.mobile button{background:none;color:#fff;border:0;font-weight:800}.main{padding:16px}.stats{grid-template-columns:1fr 1fr}.request{grid-template-columns:1fr auto}.hide-sm{display:none}.top h1{font-size:1.55rem}}@media(max-width:460px){.stat{padding:15px}.stat b{font-size:1.5rem}.panel-head{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="mobile"><b>UZHANDY ADMIN</b><button class="logout">Logout</button></div><div class="app"><aside class="side"><div class="brand">UZHANDY <small>USA LLC · ADMIN</small></div><a class="active" href="index.html">Dashboard</a><a href="../index.html">View Website ↗</a><button class="logout">Log out</button></aside><main class="main"><div class="top"><div><h1>Dashboard</h1><div class="user" id="userEmail"></div></div><button class="btn light" id="refresh">Refresh</button></div><div id="error"></div><section class="stats"><div class="stat"><span>New</span><b id="newCount">—</b></div><div class="stat"><span>Contacted</span><b id="contactedCount">—</b></div><div class="stat"><span>Scheduled</span><b id="scheduledCount">—</b></div><div class="stat"><span>Completed</span><b id="completedCount">—</b></div></section><section class="panel"><div class="panel-head"><h2>Estimate Requests</h2><div class="filters" id="filters"><button class="filter on" data-filter="all">All</button><button class="filter" data-filter="new">New</button><button class="filter" data-filter="contacted">Contacted</button><button class="filter" data-filter="scheduled">Scheduled</button><button class="filter" data-filter="completed">Completed</button></div></div><div id="requests" class="loading">Loading requests…</div></section></main></div><dialog id="dlg"><form class="modal" id="form"><h2 id="title">Request</h2><div class="field"><label>Customer</label><input id="name" disabled></div><div class="field"><label>Phone</label><input id="phone" disabled></div><div class="field"><label>Service</label><input id="service" disabled></div><div class="field"><label>ZIP / Area</label><input id="zip" disabled></div><div class="field"><label>Details</label><textarea id="details" disabled></textarea></div><div class="field"><label>Project Photos</label><div id="photos" class="photos"><div class="photo-loading">Loading photos…</div></div></div><div class="field"><label>Status</label><select id="status"><option value="new">New</option><option value="contacted">Contacted</option><option value="scheduled">Scheduled</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div><div class="actions"><button type="button" class="btn light" id="close">Cancel</button><button class="btn dark">Save Status</button></div></form></dialog><dialog id="photoDlg" class="photo-view"><button type="button" class="photo-close" id="photoClose">×</button><img id="photoLarge" alt="Project photo"></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script>
const cfg=window.UZHANDY_CONFIG||{};if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)location.replace('login.html');const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);let requests=[],filter='all',editing=null;const $=s=>document.querySelector(s),esc=(s='')=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function fail(t){$('#error').innerHTML='<div class="error">'+esc(t)+'</div>'}async function guard(){const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('login.html');return false}const {data,error}=await sb.from('admin_users').select('user_id').eq('user_id',session.user.id).maybeSingle();if(error||!data){await sb.auth.signOut();location.replace('login.html');return false}$('#userEmail').textContent=session.user.email;return true}
function render(){['new','contacted','scheduled','completed'].forEach(s=>$('#'+s+'Count').textContent=requests.filter(x=>x.status===s).length);const list=filter==='all'?requests:requests.filter(x=>x.status===filter);$('#requests').className='';$('#requests').innerHTML=list.length?list.map(x=>`<div class="request"><div><b>${esc(x.name)}</b><small>${esc(x.service)} · ${esc(x.zip_code||'ZIP not set')}</small></div><div class="hide-sm">${esc(x.phone)}<small>${new Date(x.created_at).toLocaleString()}</small></div><div class="hide-sm"><span class="badge ${esc(x.status)}">${esc(x.status.toUpperCase())}</span></div><button class="btn light" onclick="openReq(${x.id})">View</button></div>`).join(''):'<div class="empty">No requests yet.</div>'}
async function load(){fail('');$('#error').innerHTML='';$('#requests').className='loading';$('#requests').textContent='Loading requests…';const {data,error}=await sb.from('estimate_requests').select('*').order('created_at',{ascending:false});if(error){fail(error.message);$('#requests').textContent='Could not load requests.';return}requests=data||[];render()}
async function loadPhotos(id){const box=$('#photos');box.innerHTML='<div class="photo-loading">Loading photos…</div>';const {data,error}=await sb.from('estimate_photos').select('*').eq('request_id',id);if(error){box.innerHTML='<div class="photo-empty">Could not load photos.</div>';return}if(!data||!data.length){box.innerHTML='<div class="photo-empty">No photos attached.</div>';return}const items=[];for(const p of data){const path=p.storage_path||p.path||p.file_path||p.object_path;if(!path)continue;const {data:signed,error:e}=await sb.storage.from('estimate-photos').createSignedUrl(path,3600);if(!e&&signed?.signedUrl)items.push({url:signed.signedUrl,name:p.file_name||'Project photo'})}box.innerHTML=items.length?items.map(p=>`<button type="button" class="photo" data-url="${esc(p.url)}"><img src="${esc(p.url)}" alt="${esc(p.name)}"></button>`).join(''):'<div class="photo-empty">No viewable photos.</div>'}window.openReq=async id=>{const x=requests.find(r=>r.id===id);if(!x)return;editing=id;$('#title').textContent='Request #UZ-'+id;$('#name').value=x.name||'';$('#phone').value=x.phone||'';$('#service').value=x.service||'';$('#zip').value=x.zip_code||'';$('#details').value=x.details||'';$('#status').value=x.status;$('#dlg').showModal();await loadPhotos(id)};$('#close').onclick=()=>$('#dlg').close();$('#form').onsubmit=async e=>{e.preventDefault();const status=$('#status').value;const {error}=await sb.from('estimate_requests').update({status}).eq('id',editing);if(error){fail(error.message);return}$('#dlg').close();await load()};$('#filters').onclick=e=>{if(!e.target.dataset.filter)return;filter=e.target.dataset.filter;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('on',b===e.target));render()};$('#refresh').onclick=load;$('#photos').onclick=e=>{const b=e.target.closest('.photo');if(!b)return;$('#photoLarge').src=b.dataset.url;$('#photoDlg').showModal()};$('#photoClose').onclick=()=>$('#photoDlg').close();$('#photoDlg').onclick=e=>{if(e.target===$('#photoDlg'))$('#photoDlg').close()};document.querySelectorAll('.logout').forEach(b=>b.onclick=async()=>{await sb.auth.signOut();location.replace('login.html')});(async()=>{if(await guard())await load()})();
</script></body></html>
