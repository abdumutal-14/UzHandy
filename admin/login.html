<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Login | UzHandy USA LLC</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#101722;color:#25282d;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);background:#fff;border-radius:22px;padding:30px;box-shadow:0 30px 80px #0005}.logo{font-weight:950;color:#172033;font-size:1.45rem}.logo span{color:#c9413a}.sub{color:#69717d;margin:8px 0 24px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:.8rem;font-weight:850;color:#172033}.field input{width:100%;min-height:48px;border:1px solid #d7d5d0;border-radius:11px;padding:0 13px;font-size:16px}.btn{width:100%;min-height:49px;border:0;border-radius:11px;background:#c9413a;color:#fff;font-weight:900;cursor:pointer;margin-top:8px}.msg{display:none;margin-top:14px;padding:11px;border-radius:10px;background:#fff0ef;color:#9b2d28;font-size:.88rem}.back{display:block;text-align:center;margin-top:18px;color:#69717d;font-weight:700;font-size:.85rem}
</style></head><body><main class="card"><div class="logo">UZHANDY <span>ADMIN</span></div><p class="sub">Sign in to manage estimate requests.</p><form id="login"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" id="submit">Sign In</button><div class="msg" id="msg"></div></form><a class="back" href="../index.html">← Back to website</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script>
const cfg=window.UZHANDY_CONFIG||{}, msg=document.getElementById('msg'), btn=document.getElementById('submit');
const show=t=>{msg.textContent=t;msg.style.display='block'};
if(!cfg.supabaseUrl||!cfg.supabaseAnonKey){show('Supabase configuration is missing.');btn.disabled=true}else{
 const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
 async function isAdmin(user){const {data,error}=await sb.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();return !error&&!!data}
 (async()=>{const {data:{session}}=await sb.auth.getSession();if(session&&await isAdmin(session.user)) location.replace('index.html')})();
 document.getElementById('login').onsubmit=async e=>{e.preventDefault();msg.style.display='none';btn.disabled=true;btn.textContent='Signing in…';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){show('Email or password is incorrect.');btn.disabled=false;btn.textContent='Sign In';return}if(!await isAdmin(data.user)){await sb.auth.signOut();show('This account does not have admin access.');btn.disabled=false;btn.textContent='Sign In';return}location.replace('index.html')}
}
</script></body></html>
